<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – MindRecruiting</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-light auth-page">
  <main class="auth-wrapper">
    <div class="auth-card">
      <h1>Login to MindRecruiting</h1>
      <p class="auth-sub">
        Use the work email and password you registered with.
      </p>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="field">
          <label for="login-email">Work email</label>
          <input type="email" id="login-email" required placeholder="you@company.com" />
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="Password" />
        </div>

        <button type="submit" class="btn btn-primary full">Login</button>
        <p class="form-error" id="login-error"></p>
      </form>

      <p class="auth-footer-text">
        New to MindRecruiting?
        <a href="register.html">Create a free account</a>
      </p>
    </div>
  </main>
</body>
<script src="script.js"></script>
</html>
