<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account – MindRecruiting</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-light auth-page">
  <main class="auth-wrapper">
    <div class="auth-card">
      <h1>Create your MindRecruiting account</h1>
      <p class="auth-sub">
        Please use your professional work email.
        Personal domains like Gmail / Outlook / Yahoo are blocked.
      </p>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="field">
          <label for="reg-name">Full name</label>
          <input id="reg-name" type="text" required placeholder="Your name" />
        </div>

        <div class="field">
          <label for="reg-email">Work email</label>
          <input id="reg-email" type="email" required placeholder="you@company.com" />
        </div>

        <div class="field">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" required placeholder="Min. 6 characters" />
        </div>

        <div class="field">
          <label for="reg-password2">Confirm password</label>
          <input id="reg-password2" type="password" required placeholder="Type again" />
        </div>

        <button type="submit" class="btn btn-primary full">Create account</button>

        <p id="register-error" class="form-error"></p>
        <p id="register-success" class="form-success"></p>
      </form>

      <p class="auth-footer-text">
        Already have an account?
        <a href="login.html">Login here</a>
      </p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
