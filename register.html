<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – MindRecruiting</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-page">

  <div class="auth-wrapper">
    <div class="auth-card">

      <h1>Create Account</h1>
      <p class="auth-sub">Use your company/work email only.</p>

      <form id="register-form">

        <div class="field">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" required />
        </div>

        <div class="field">
          <label for="reg-email">Work Email</label>
          <input type="email" id="reg-email" required />
        </div>

        <div class="field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required />
        </div>

        <div class="field">
          <label for="reg-password2">Confirm Password</label>
          <input type="password" id="reg-password2" required />
        </div>

        <div id="register-error" class="form-error"></div>
        <div id="register-success" class="form-success"></div>

        <button type="submit" class="btn-ai primary-ai full">
          Create Account
        </button>

      </form>

      <p class="auth-footer-text">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </div>
  </div>

  <script src="register.js"></script>
</body>
</html>
